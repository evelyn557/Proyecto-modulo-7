{% extends "base.html" %}

{% block title %}{{ titulo }} | Alke Wallet{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-bd-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4">{{ cliente.nombre }}</h1>
                <p class="text-muted">Email: {{ cliente.email }}</p>
                <p class="text-muted">Teléfono: {{ cliente.telefono }}</p>
            </div>
        </div>
    </div>
</div>


{% endblock %}
